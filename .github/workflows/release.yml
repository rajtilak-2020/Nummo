name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'REQUIRED: Enter Release Version Tag (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Stable Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nummo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare Release Version & Rename APK
        id: prep
        run: |
          TAG_NAME="${{ github.event.inputs.version_tag }}"
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Release version tag is required to proceed!"
            exit 1
          fi
          
          # Ensure tag starts with 'v'
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v$TAG_NAME"
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          NEW_APK_PATH="build/app/outputs/flutter-apk/Nummo-${TAG_NAME}.apk"
          cp "$APK_PATH" "$NEW_APK_PATH"
          echo "apk_path=$NEW_APK_PATH" >> $GITHUB_OUTPUT

      - name: Create STABLE GitHub Release & Upload APK Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: Nummo ${{ steps.prep.outputs.tag_name }}
          files: ${{ steps.prep.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
