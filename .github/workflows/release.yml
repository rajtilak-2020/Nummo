name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nummo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release and Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine tag name automatically
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            # Extract version from pubspec.yaml (e.g. version: 1.0.0+1 -> v1.0.0)
            VERSION=$(grep '^version:' pubspec.yaml | head -n1 | sed -E 's/version:[[:space:]]*//' | sed -E 's/\+[0-9]+//')
            TAG_NAME="v$VERSION"
          fi
          
          echo "Target Release Tag: $TAG_NAME"
          
          # Prepare named APK binary
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          NEW_APK_PATH="build/app/outputs/flutter-apk/Nummo-${TAG_NAME}.apk"
          cp "$APK_PATH" "$NEW_APK_PATH"
          
          # Create release with auto-generated commit notes since last release, or upload asset if release exists
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Uploading artifact..."
            gh release upload "$TAG_NAME" "$NEW_APK_PATH" --clobber
          else
            echo "Creating release $TAG_NAME with auto-analyzed release notes..."
            gh release create "$TAG_NAME" "$NEW_APK_PATH" \
              --title "Nummo $TAG_NAME" \
              --generate-notes
          fi

