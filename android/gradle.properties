# Gradle JVM memory bounds & Garbage Collection tuning to prevent system freezes
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -XX:+UnlockExperimentalVMOptions --enable-native-access=ALL-UNNAMED

# Kotlin Daemon JVM limits
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC

# Restrict parallel worker pool to prevent 12-core parallel RAM exhaustion
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000

# File system & Android build options
org.gradle.vfs.watch=false
android.useAndroidX=true


# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
