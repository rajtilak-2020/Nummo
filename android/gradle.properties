# Gradle JVM memory bounds & Garbage Collection tuning to prevent system freezes
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=50 -XX:+UnlockExperimentalVMOptions --enable-native-access=ALL-UNNAMED -XX:CICompilerCount=2

# Java 17 LTS is configured globally in Flutter via `flutter config --jdk-dir`
# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk

# Kotlin Daemon JVM limits
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC

# Restrict worker pool to prevent 12-core parallel RAM exhaustion and freeze
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true

# Terminate daemon after 60s of idle time to prevent lingering daemons hogging RAM
org.gradle.daemon.idletimeout=60000

# Disable VFS watching to reduce in-memory cache and inotify overhead
org.gradle.vfs.watch=false

# File system & Android build options
android.useAndroidX=true
android.enableR8.fullMode=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
