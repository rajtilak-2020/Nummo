  <!-- iOS Safari input auto-zoom prevention -->
  <style>
    /* Prevent iOS Safari auto-zoom by ensuring minimum 16px font size on inputs */
    input,
    textarea,
    select,
    [contenteditable],
    flt-text-editing-host input,
    flt-text-editing-host textarea,
    flt-glass-pane input,
    flt-glass-pane textarea {
      font-size: 16px !important;
    }

    /* Prevent rubber-band bounce clipping while preserving touch gestures */
    html,
    body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>

  <script>
    // Safeguard: Reset iOS Safari scroll offset when an input loses focus
    window.addEventListener(
      "blur",
      function (e) {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
          window.scrollTo(0, 0);
        }
      },
      true,
    );
  </script>
